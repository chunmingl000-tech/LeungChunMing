<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b63">
  <title>IT PMO | Project Board</title>
  <style>
    /* Design tokens */
    :root {
      color-scheme: light;
      --blue-950: #102f4d;
      --blue-900: #123b63;
      --blue-800: #194f7c;
      --blue-700: #23689e;
      --blue-100: #e7f0f8;
      --blue-050: #f3f7fb;
      --ink: #1d2b38;
      --muted: #647587;
      --line: #d7e0e8;
      --surface: #fff;
      --canvas: #f2f5f8;
      --red: #b63838;
      --red-soft: #fff0ef;
      --amber: #a76b08;
      --amber-soft: #fff5df;
      --green: #23734c;
      --green-soft: #e8f5ed;
      --radius-sm: 6px;
      --radius: 10px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --shadow: 0 2px 8px rgb(16 47 77 / 7%);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    /* Base and shared controls */
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    [draggable="true"]:focus-visible {
      outline: 3px solid #68a9df;
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* Application header and live summary */
    .app-header { background: var(--blue-900); color: #fff; padding: var(--space-5) clamp(16px, 4vw, 48px) var(--space-4); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .wordmark { display: flex; align-items: center; gap: var(--space-3); font-weight: 750; letter-spacing: .02em; }
    .wordmark-mark { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid rgb(255 255 255 / 55%); border-radius: 8px; font-size: 15px; }
    .wordmark-text { font-size: 17px; }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); }
    .header-note { color: #d1e1ef; font-size: 12px; text-align: right; }
    .add-button { border: 0; border-radius: var(--radius-sm); padding: 10px 15px; background: #fff; color: var(--blue-900); font-weight: 700; }
    .add-button:hover { background: var(--blue-050); }
    .summary-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--space-5); }
    .summary-item { display: flex; align-items: baseline; gap: 7px; padding: 7px 11px; border: 1px solid rgb(255 255 255 / 24%); border-radius: 999px; background: rgb(255 255 255 / 8%); font-size: 12px; }
    .summary-item strong { font-size: 15px; }

    /* Add-task form panel */
    .form-panel { padding: var(--space-6) clamp(16px, 4vw, 48px); background: #fff; border-bottom: 1px solid var(--line); }
    .form-panel[hidden] { display: none; }
    .form-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); max-width: 1120px; margin: 0 auto var(--space-4); }
    .form-heading h2 { margin: 0; font-size: 19px; }
    .close-button { border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
    .task-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3) var(--space-4); max-width: 1120px; margin: auto; }
    .field { min-width: 0; }
    .field-wide { grid-column: span 2; }
    .field-full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 6px; color: #34495c; font-size: 12px; font-weight: 700; }
    .field input, .field select, .field textarea, .filter-control input, .filter-control select {
      width: 100%; min-height: 40px; padding: 9px 10px; border: 1px solid #bdcbd7; border-radius: var(--radius-sm); background: #fff; color: var(--ink);
    }
    .field textarea { min-height: 74px; resize: vertical; }
    .field [aria-invalid="true"] { border-color: var(--red); }
    .field-error { display: block; min-height: 16px; padding-top: 3px; color: var(--red); font-size: 11px; }
    .form-actions { display: flex; align-items: center; gap: var(--space-3); grid-column: 1 / -1; }
    .primary-button { border: 0; border-radius: var(--radius-sm); padding: 10px 17px; background: var(--blue-800); color: #fff; font-weight: 700; }
    .primary-button:hover:not(:disabled) { background: var(--blue-950); }
    .primary-button:disabled { cursor: wait; opacity: .7; }
    .secondary-button { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 14px; background: #fff; color: var(--ink); }

    /* Filters and board layout */
    main { padding: var(--space-5) clamp(12px, 3vw, 36px) var(--space-8); }
    .filter-bar { display: flex; align-items: end; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4); padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .filter-control { width: min(220px, 100%); }
    .filter-control label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .filter-control input, .filter-control select { min-height: 36px; padding: 7px 9px; font-size: 13px; }
    .clear-filters { min-height: 36px; border: 0; padding: 7px 10px; background: transparent; color: var(--blue-800); font-size: 12px; font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); align-items: start; gap: var(--space-4); }
    .column { min-width: 0; min-height: 360px; padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius); background: #e9eef3; transition: background-color .15s, border-color .15s, box-shadow .15s; }
    .column.drop-target { border-color: var(--blue-700); background: #dceaf6; box-shadow: inset 0 0 0 2px rgb(35 104 158 / 17%); }
    .column-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin: 1px 2px var(--space-3); }
    .column-header h2 { margin: 0; color: #294158; font-size: 14px; }
    .count-badge { min-width: 24px; padding: 3px 7px; border-radius: 999px; background: #fff; color: #526579; font-size: 11px; font-weight: 700; text-align: center; }
    .card-list { display: grid; gap: var(--space-3); min-height: 300px; }
    .empty-column { padding: 20px 8px; color: #728294; font-size: 12px; text-align: center; }

    /* Task cards, status/priority labels, and inline actions */
    .task-card { position: relative; padding: var(--space-3); border: 1px solid #d5dee6; border-left: 4px solid #8291a0; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); cursor: grab; }
    .task-card:active { cursor: grabbing; }
    .task-card.priority-critical { border-left-color: #bd3535; }
    .task-card.priority-high { border-left-color: #d39219; }
    .task-card.priority-medium { border-left-color: #347db6; }
    .task-card.priority-low { border-left-color: #83909b; }
    .card-top, .card-bottom, .card-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .task-id { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .035em; }
    .card-actions { display: flex; align-items: center; gap: 7px; }
    .delete-button { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #718092; font-size: 20px; line-height: 1; }
    .delete-button:hover { background: var(--red-soft); color: var(--red); }
    .delete-prompt { color: var(--red); font-size: 10px; white-space: nowrap; }
    .delete-prompt button { border: 0; padding: 2px; background: transparent; color: var(--red); font-size: 10px; font-weight: 700; text-decoration: underline; }
    .task-title { margin: 9px 0 5px; color: #1d3348; font-size: 14px; line-height: 1.35; }
    .project-name { margin: 0 0 10px; color: #617386; font-size: 11px; }
    .card-meta { justify-content: flex-start; flex-wrap: wrap; margin-bottom: 9px; }
    .priority-pill, .category-tag, .overdue-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 7px; font-size: 10px; font-weight: 700; }
    .priority-pill { background: #edf2f6; color: #405366; }
    .priority-pill.critical { background: var(--red-soft); color: #9e2929; }
    .priority-pill.high { background: var(--amber-soft); color: #875300; }
    .priority-pill.medium { background: var(--blue-100); color: #245c88; }
    .priority-pill.low { background: #edf0f2; color: #596774; }
    .category-tag { border: 1px solid #dce4eb; background: #fff; color: #5c6e7d; font-weight: 600; }
    .overdue-badge { background: var(--red-soft); color: #a12e2e; }
    .card-bottom { padding-top: 9px; border-top: 1px solid #edf0f3; color: #627385; font-size: 10px; }
    .due-date { white-space: nowrap; }
    .move-select { max-width: 112px; min-height: 27px; padding: 3px 5px; border: 1px solid #d2dce5; border-radius: 4px; background: #fff; color: var(--blue-800); font-size: 10px; }

    /* Toast notifications and responsive behavior */
    .toast-region { position: fixed; z-index: 5; top: 16px; right: 16px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); }
    .toast { padding: 12px 14px; border: 1px solid #b6d5c2; border-radius: 8px; background: var(--green-soft); color: #205b3d; box-shadow: 0 6px 20px rgb(16 47 77 / 15%); font-size: 13px; }
    .toast.warning { border-color: #edc4a4; background: #fff4e9; color: #815015; }
    @media (max-width: 1000px) {
      .board { grid-template-columns: repeat(2, minmax(230px, 1fr)); }
      .column { min-height: 280px; }
      .card-list { min-height: 220px; }
    }
    @media (max-width: 767px) {
      .app-header { padding-top: 15px; }
      .header-top { align-items: flex-start; }
      .header-actions { align-items: flex-end; flex-direction: column-reverse; gap: 7px; }
      .header-note { max-width: 155px; font-size: 10px; }
      .summary-strip { gap: 6px; margin-top: 15px; }
      .summary-item { padding: 6px 9px; font-size: 11px; }
      .board { grid-template-columns: 1fr; }
      .column { min-height: 130px; }
      .card-list { min-height: 72px; }
      .task-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field-wide { grid-column: span 2; }
    }
    @media (max-width: 420px) {
      .wordmark-mark { width: 31px; height: 31px; }
      .wordmark-text { font-size: 14px; }
      .add-button { padding: 8px 10px; font-size: 12px; }
      .task-form { grid-template-columns: 1fr; }
      .field-wide, .field-full, .form-actions { grid-column: 1; }
      .filter-control { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Application header: neutral IT PMO branding and live board summary -->
  <header class="app-header">
    <div class="header-top">
      <div class="wordmark" aria-label="IT PMO">
        <span class="wordmark-mark" aria-hidden="true">IT</span>
        <span class="wordmark-text">IT PMO</span>
      </div>
      <div class="header-actions">
        <div class="header-note">Demo board · Refreshing resets to the seeded demo tasks.</div>
        <button class="add-button" id="toggle-form" type="button" aria-expanded="false" aria-controls="add-task-panel">+ Add Task</button>
      </div>
    </div>
    <div class="summary-strip" id="summary-strip" aria-label="Board summary"></div>
  </header>

  <!-- Add-task form: revealed from the header action -->
  <section class="form-panel" id="add-task-panel" aria-labelledby="form-title" hidden>
    <div class="form-heading">
      <h2 id="form-title">Add a task</h2>
      <button class="close-button" id="close-form" type="button" aria-label="Close add task form">×</button>
    </div>
    <form class="task-form" id="task-form" novalidate>
      <div class="field field-wide">
        <label for="task-title">Task Title</label>
        <input id="task-title" name="title" type="text" maxlength="80" required autocomplete="off">
        <span class="field-error" id="error-title"></span>
      </div>
      <div class="field field-wide">
        <label for="task-assignee">Assignee</label>
        <input id="task-assignee" name="assignee" type="text" required maxlength="80" autocomplete="name">
        <span class="field-error" id="error-assignee"></span>
      </div>
      <div class="field field-full">
        <label for="task-description">Description <span class="muted">(optional)</span></label>
        <textarea id="task-description" name="description" maxlength="500"></textarea>
        <span class="field-error" id="error-description"></span>
      </div>
      <div class="field field-wide">
        <label for="task-project">Project / Workstream</label>
        <select id="task-project" name="project" required>
          <option value="">Select a workstream</option>
          <option>Core Banking Upgrade</option>
          <option>Digital Channels</option>
          <option>Cybersecurity Uplift</option>
          <option>Data &amp; Analytics</option>
          <option>Infrastructure &amp; Cloud</option>
          <option>Vendor Management</option>
        </select>
        <span class="field-error" id="error-project"></span>
      </div>
      <div class="field field-wide">
        <label for="task-category">Category</label>
        <select id="task-category" name="category" required>
          <option value="">Select a category</option>
          <option>Application Development</option>
          <option>Infrastructure</option>
          <option>Cybersecurity</option>
          <option>Data</option>
          <option>Compliance</option>
          <option>Vendor</option>
        </select>
        <span class="field-error" id="error-category"></span>
      </div>
      <div class="field">
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option>
        </select>
        <span class="field-error" id="error-priority"></span>
      </div>
      <div class="field">
        <label for="task-due-date">Due Date</label>
        <input id="task-due-date" name="dueDate" type="date" required>
        <span class="field-error" id="error-dueDate"></span>
      </div>
      <div class="field">
        <label for="task-status">Status</label>
        <select id="task-status" name="status">
          <option>Backlog</option><option>In Progress</option><option>Blocked</option><option>Done</option>
        </select>
        <span class="field-error" id="error-status"></span>
      </div>
      <div class="form-actions">
        <button class="primary-button" id="submit-task" type="submit">Add task</button>
        <button class="secondary-button" id="cancel-form" type="button">Cancel</button>
      </div>
    </form>
  </section>

  <!-- Main board: client-side filters and four fixed Kanban columns -->
  <main>
    <section class="filter-bar" aria-label="Filter tasks">
      <div class="filter-control">
        <label for="filter-project">Project / Workstream</label>
        <select id="filter-project"><option value="">All projects</option></select>
      </div>
      <div class="filter-control">
        <label for="filter-assignee">Assignee</label>
        <input id="filter-assignee" type="search" placeholder="Contains…">
      </div>
      <div class="filter-control">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority">
          <option value="">All priorities</option>
          <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
        </select>
      </div>
      <button class="clear-filters" id="clear-filters" type="button">Clear filters</button>
    </section>
    <section class="board" id="board" aria-label="IT project Kanban board"></section>
  </main>

  <!-- Live announcements for submit, delete, and notification outcomes -->
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script>
    /* FormSubmit config: replace the address here. The first submission triggers a confirmation email to that address; notifications deliver only after its link is clicked. */
    const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

    /* Board state and seeded demo data: all task data exists only in memory. */
    const COLUMNS = ["Backlog", "In Progress", "Blocked", "Done"];
    const PROJECTS = [
      "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
      "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"
    ];
    const today = new Date();
    const dateOffset = (days) => {
      const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    };
    const state = {
      tasks: [
        { id: "UOB-ITPM-0001", title: "Migrate FX pricing service to AWS", description: "Move pricing workloads to the approved cloud landing zone.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Alicia Tan", priority: "High", dueDate: dateOffset(9), status: "In Progress" },
        { id: "UOB-ITPM-0002", title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Coordinate the endpoint patch rollout and validate branch readiness.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Marcus Lim", priority: "Critical", dueDate: dateOffset(-2), status: "Blocked" },
        { id: "UOB-ITPM-0003", title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business and operations acceptance for the release.", project: "Digital Channels", category: "Application Development", assignee: "Priya Nair", priority: "High", dueDate: dateOffset(4), status: "In Progress" },
        { id: "UOB-ITPM-0004", title: "Reconcile customer data quality rules", description: "Review exception thresholds with the data governance team.", project: "Data & Analytics", category: "Data", assignee: "Daniel Koh", priority: "Medium", dueDate: dateOffset(16), status: "Backlog" },
        { id: "UOB-ITPM-0005", title: "Renew SWIFT gateway support agreement", description: "Confirm commercial terms and obtain procurement approval.", project: "Vendor Management", category: "Vendor", assignee: "Mei Chen", priority: "Medium", dueDate: dateOffset(-1), status: "Backlog" },
        { id: "UOB-ITPM-0006", title: "Complete payment hub failover rehearsal", description: "Capture recovery timings and close resilience findings.", project: "Core Banking Upgrade", category: "Application Development", assignee: "James Wong", priority: "Low", dueDate: dateOffset(2), status: "Done" },
        { id: "UOB-ITPM-0007", title: "Approve privileged access recertification", description: "Waiting for final sign-off from the application owner.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Sofia Rahman", priority: "High", dueDate: dateOffset(6), status: "Blocked" },
        { id: "UOB-ITPM-0008", title: "Upgrade analytics warehouse capacity", description: "Estimate compute headroom for the next reporting cycle.", project: "Data & Analytics", category: "Data", assignee: "Ethan Lee", priority: "Low", dueDate: dateOffset(21), status: "Backlog" }
      ],
      filters: { project: "", assignee: "", priority: "" }
    };

    /* HTML escaping and compact data helpers */
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function isOverdue(task) {
      return task.status !== "Done" && task.dueDate < dateOffset(0);
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(date);
    }

    /* Rendering: board/card contents are always rebuilt from the in-memory state. */
    function renderSummary() {
      const counts = Object.fromEntries(COLUMNS.map((column) => [column, state.tasks.filter((task) => task.status === column).length]));
      const overdue = state.tasks.filter(isOverdue).length;
      document.getElementById("summary-strip").innerHTML = [
        `<span class="summary-item"><strong>${state.tasks.length}</strong> Total tasks</span>`,
        ...COLUMNS.map((column) => `<span class="summary-item"><strong>${counts[column]}</strong> ${escapeHtml(column)}</span>`),
        `<span class="summary-item"><strong>${overdue}</strong> Overdue</span>`
      ].join("");
    }

    function renderCard(task) {
      const priorityClass = task.priority.toLowerCase();
      const deletePrompt = task.confirmDelete
        ? `<span class="delete-prompt">Delete? <button type="button" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button> / <button type="button" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button></span>`
        : `<button class="delete-button" type="button" data-action="ask-delete" data-id="${escapeHtml(task.id)}" aria-label="Delete ${escapeHtml(task.title)}">×</button>`;
      const overdueBadge = isOverdue(task) ? '<span class="overdue-badge">Overdue</span>' : "";
      const moveOptions = COLUMNS.filter((column) => column !== task.status)
        .map((column) => `<option value="${escapeHtml(column)}">${escapeHtml(column)}</option>`).join("");
      return `
        <article class="task-card priority-${escapeHtml(priorityClass)}" draggable="true" tabindex="0" data-id="${escapeHtml(task.id)}" aria-label="${escapeHtml(task.id)}: ${escapeHtml(task.title)}">
          <div class="card-top">
            <span class="task-id">${escapeHtml(task.id)}</span>
            <div class="card-actions">${deletePrompt}</div>
          </div>
          <h3 class="task-title">${escapeHtml(task.title)}</h3>
          <p class="project-name">${escapeHtml(task.project)}</p>
          <div class="card-meta">
            <span class="priority-pill ${escapeHtml(priorityClass)}">${escapeHtml(task.priority)}</span>
            <span class="category-tag">${escapeHtml(task.category)}</span>
            ${overdueBadge}
          </div>
          <div class="card-bottom">
            <span class="due-date">Due ${escapeHtml(formatDate(task.dueDate))}</span>
            <span>${escapeHtml(task.assignee)}</span>
          </div>
          <div class="card-bottom">
            <span>Move ▸</span>
            <label class="sr-only" for="move-${escapeHtml(task.id)}">Move ${escapeHtml(task.title)} to another column</label>
            <select class="move-select" id="move-${escapeHtml(task.id)}" data-action="move" data-id="${escapeHtml(task.id)}">
              <option value="">Choose column</option>${moveOptions}
            </select>
          </div>
        </article>`;
    }

    function renderBoard() {
      renderSummary();
      renderProjectFilter();
      const board = document.getElementById("board");
      board.innerHTML = COLUMNS.map((column) => {
        const tasks = applyFilters(state.tasks.filter((task) => task.status === column));
        return `
          <section class="column" data-status="${escapeHtml(column)}" aria-label="${escapeHtml(column)} column">
            <div class="column-header"><h2>${escapeHtml(column)}</h2><span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span></div>
            <div class="card-list">${tasks.length ? tasks.map(renderCard).join("") : '<p class="empty-column">No matching tasks</p>'}</div>
          </section>`;
      }).join("");
    }

    function renderProjectFilter() {
      const select = document.getElementById("filter-project");
      const current = state.filters.project;
      const projects = [...new Set(state.tasks.map((task) => task.project))].sort();
      select.innerHTML = '<option value="">All projects</option>' + projects.map((project) =>
        `<option value="${escapeHtml(project)}">${escapeHtml(project)}</option>`).join("");
      select.value = projects.includes(current) ? current : "";
      state.filters.project = select.value;
    }

    /* Filtering and board actions */
    function applyFilters(tasks) {
      const { project, assignee, priority } = state.filters;
      return tasks.filter((task) =>
        (!project || task.project === project) &&
        (!assignee || task.assignee.toLowerCase().includes(assignee.toLowerCase())) &&
        (!priority || task.priority === priority)
      );
    }

    function moveTask(taskId, targetStatus) {
      if (!COLUMNS.includes(targetStatus)) return;
      const task = state.tasks.find((item) => item.id === taskId);
      if (!task || task.status === targetStatus) return;
      task.status = targetStatus;
      task.confirmDelete = false;
      renderBoard();
    }

    function deleteTask(taskId) {
      state.tasks = state.tasks.filter((task) => task.id !== taskId);
      renderBoard();
      showToast("Task deleted.");
    }

    /* Add task form validation and optimistic submission */
    const formFields = ["title", "assignee", "description", "project", "category", "priority", "dueDate", "status"];

    function validateTask(formData) {
      const errors = {};
      if (!String(formData.get("title")).trim()) errors.title = "Enter a task title.";
      if (String(formData.get("title")).trim().length > 80) errors.title = "Use 80 characters or fewer.";
      if (!String(formData.get("assignee")).trim()) errors.assignee = "Enter an assignee.";
      if (!String(formData.get("project"))) errors.project = "Select a project or workstream.";
      if (!String(formData.get("category"))) errors.category = "Select a category.";
      if (!String(formData.get("dueDate"))) errors.dueDate = "Select a due date.";
      else if (String(formData.get("dueDate")) < dateOffset(0)) errors.dueDate = "Due date cannot be in the past.";
      if (String(formData.get("description")).length > 500) errors.description = "Use 500 characters or fewer.";
      return errors;
    }

    function showValidationErrors(errors) {
      formFields.forEach((name) => {
        const input = document.getElementById(`task-${name === "title" ? "title" : name === "assignee" ? "assignee" : name === "description" ? "description" : name === "project" ? "project" : name === "category" ? "category" : name === "priority" ? "priority" : name === "dueDate" ? "due-date" : "status"}`);
        const error = document.getElementById(`error-${name}`);
        error.textContent = errors[name] || "";
        if (errors[name]) input.setAttribute("aria-invalid", "true");
        else input.removeAttribute("aria-invalid");
      });
    }

    function addTask(task) {
      const highestId = state.tasks.reduce((highest, item) => {
        const match = item.id.match(/^UOB-ITPM-(\d{4})$/);
        return match ? Math.max(highest, Number(match[1])) : highest;
      }, 0);
      const newTask = { ...task, id: `UOB-ITPM-${String(highestId + 1).padStart(4, "0")}` };
      state.tasks.unshift(newTask);
      renderBoard();
      return newTask;
    }

    /* FormSubmit AJAX notification; failure is isolated from the local board. */
    async function notifyNewTask(task) {
      const res = await fetch(FORMSUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
          _template: "table",
          _captcha: "false",
          "Task ID": task.id,
          Title: task.title,
          Description: task.description,
          Project: task.project,
          Category: task.category,
          Assignee: task.assignee,
          Priority: task.priority,
          "Due Date": task.dueDate,
          Status: task.status,
          "Submitted At": new Date().toISOString()
        })
      });
      if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
      return res.json();
    }

    /* Toasts and UI wiring */
    function showToast(message, warning = false) {
      const region = document.getElementById("toast-region");
      const toast = document.createElement("div");
      toast.className = warning ? "toast warning" : "toast";
      toast.textContent = message;
      region.appendChild(toast);
      window.setTimeout(() => toast.remove(), 4200);
    }

    function setFormVisible(visible) {
      const panel = document.getElementById("add-task-panel");
      panel.hidden = !visible;
      document.getElementById("toggle-form").setAttribute("aria-expanded", String(visible));
      if (visible) document.getElementById("task-title").focus();
    }

    document.getElementById("toggle-form").addEventListener("click", () => setFormVisible(true));
    document.getElementById("close-form").addEventListener("click", () => setFormVisible(false));
    document.getElementById("cancel-form").addEventListener("click", () => setFormVisible(false));

    document.getElementById("task-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const errors = validateTask(formData);
      showValidationErrors(errors);
      if (Object.keys(errors).length) {
        const firstInvalid = form.querySelector('[aria-invalid="true"]');
        if (firstInvalid) firstInvalid.focus();
        return;
      }

      const task = addTask({
        title: String(formData.get("title")).trim(),
        description: String(formData.get("description")).trim(),
        project: String(formData.get("project")),
        category: String(formData.get("category")),
        assignee: String(formData.get("assignee")).trim(),
        priority: String(formData.get("priority")),
        dueDate: String(formData.get("dueDate")),
        status: String(formData.get("status"))
      });
      form.reset();
      document.getElementById("task-priority").value = "Medium";
      document.getElementById("task-status").value = "Backlog";
      showValidationErrors({});
      showToast("Task added to the board.");

      const submitButton = document.getElementById("submit-task");
      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
      try {
        await notifyNewTask(task);
      } catch (error) {
        showToast("Card added locally — email notification failed", true);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Add task";
      }
    });

    document.getElementById("filter-project").addEventListener("change", (event) => {
      state.filters.project = event.target.value;
      renderBoard();
    });
    document.getElementById("filter-assignee").addEventListener("input", (event) => {
      state.filters.assignee = event.target.value.trim();
      renderBoard();
    });
    document.getElementById("filter-priority").addEventListener("change", (event) => {
      state.filters.priority = event.target.value;
      renderBoard();
    });
    document.getElementById("clear-filters").addEventListener("click", () => {
      state.filters = { project: "", assignee: "", priority: "" };
      document.getElementById("filter-assignee").value = "";
      document.getElementById("filter-priority").value = "";
      renderBoard();
    });

    document.getElementById("board").addEventListener("click", (event) => {
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const task = state.tasks.find((item) => item.id === control.dataset.id);
      if (!task) return;
      if (control.dataset.action === "ask-delete") {
        task.confirmDelete = true;
        renderBoard();
      } else if (control.dataset.action === "confirm-delete") {
        deleteTask(control.dataset.id);
      } else if (control.dataset.action === "cancel-delete") {
        task.confirmDelete = false;
        renderBoard();
      }
    });

    document.getElementById("board").addEventListener("change", (event) => {
      if (event.target.matches('[data-action="move"]') && event.target.value) {
        moveTask(event.target.dataset.id, event.target.value);
      }
    });

    /* Native HTML5 drag and drop, with status changes applied to the state array. */
    document.getElementById("board").addEventListener("dragstart", (event) => {
      const card = event.target.closest(".task-card");
      if (!card) return;
      event.dataTransfer.setData("text/plain", card.dataset.id);
      event.dataTransfer.effectAllowed = "move";
    });
    document.getElementById("board").addEventListener("dragover", (event) => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      column.classList.add("drop-target");
    });
    document.getElementById("board").addEventListener("dragleave", (event) => {
      const column = event.target.closest(".column");
      if (column && !column.contains(event.relatedTarget)) column.classList.remove("drop-target");
    });
    document.getElementById("board").addEventListener("drop", (event) => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      column.classList.remove("drop-target");
      moveTask(event.dataTransfer.getData("text/plain"), column.dataset.status);
    });

    /* Initial render */
    renderBoard();
  </script>
</body>
</html>
