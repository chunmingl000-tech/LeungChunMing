<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO Board</title>
<style>
/* ===== Design tokens ===== */
:root {
  --blue-900: #0b2a55;
  --blue-700: #14478f;
  --blue-600: #1b5cb8;
  --blue-100: #dce8f8;
  --blue-50: #f0f5fc;
  --ink: #1a2332;
  --ink-soft: #4b586b;
  --line: #d3dbe6;
  --surface: #ffffff;
  --bg: #eaeff6;
  --red: #c62828;
  --red-bg: #fde8e8;
  --amber: #d98a00;
  --amber-bg: #fff3d6;
  --blue: #1b6fd6;
  --grey: #8792a2;
  --green: #1f7a4d;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #f5a623; outline-offset: 2px; }
[hidden] { display: none; }

/* ===== Header ===== */
.app-header { background: var(--blue-900); color: #fff; padding: var(--sp-3) var(--sp-5); display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4); }
.wordmark { font-weight: 800; letter-spacing: .08em; font-size: 1.25rem; padding: var(--sp-1) var(--sp-3); border: 2px solid #fff; border-radius: 6px; }
.header-title { margin: 0; font-size: 1rem; font-weight: 500; opacity: .9; }
.summary { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-left: auto; padding: 0; list-style: none; }
.summary li { background: rgba(255,255,255,.12); border-radius: 6px; padding: var(--sp-1) var(--sp-3); font-size: .85rem; }
.summary strong { font-size: 1.05rem; margin-right: var(--sp-1); }
.summary .is-overdue { background: var(--red); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: var(--sp-2) var(--sp-4); cursor: pointer; }
.btn:hover { background: var(--blue-50); }
.btn-primary { background: var(--blue-600); border-color: var(--blue-600); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--blue-700); }
.btn[disabled] { opacity: .65; cursor: progress; }
.demo-note { font-size: .78rem; color: var(--ink-soft); margin: var(--sp-2) var(--sp-5) 0; }

/* ===== Filters ===== */
.filters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: end; margin: var(--sp-3) var(--sp-5); padding: var(--sp-3) var(--sp-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.filters label { display: flex; flex-direction: column; font-size: .78rem; font-weight: 600; color: var(--ink-soft); gap: var(--sp-1); }
.filters input, .filters select { min-width: 170px; }

/* ===== Board ===== */
.board { display: flex; gap: var(--sp-4); padding: 0 var(--sp-5) var(--sp-5); align-items: flex-start; }
.column { flex: 1 1 0; min-width: 0; background: var(--blue-50); border: 2px solid var(--line); border-radius: var(--radius); padding: var(--sp-3); min-height: 220px; transition: border-color .15s, background .15s; }
.column.drop-target { border-color: var(--blue-600); background: var(--blue-100); border-style: dashed; }
.column-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
.column-head h2 { margin: 0; font-size: .95rem; text-transform: uppercase; letter-spacing: .05em; color: var(--blue-900); }
.count { background: var(--blue-700); color: #fff; border-radius: 999px; font-size: .78rem; font-weight: 700; padding: 1px 10px; }
.cards { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 120px; }
.empty { color: var(--ink-soft); font-size: .85rem; text-align: center; padding: var(--sp-4); }

.card { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--grey); border-radius: 6px; padding: var(--sp-3); cursor: grab; box-shadow: 0 1px 2px rgba(11,42,85,.08); }
.card.dragging { opacity: .45; }
.card.prio-Critical { border-left-color: var(--red); }
.card.prio-High { border-left-color: var(--amber); }
.card.prio-Medium { border-left-color: var(--blue); }
.card.prio-Low { border-left-color: var(--grey); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
.card-id { font-size: .72rem; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.card-title { margin: var(--sp-1) 0; font-size: .95rem; font-weight: 600; overflow-wrap: anywhere; }
.card-meta { font-size: .78rem; color: var(--ink-soft); margin: 2px 0; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-2); align-items: center; margin-top: var(--sp-2); }
.pill, .tag, .badge-overdue { font-size: .7rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.pill { border: 1px solid currentColor; }
.pill-Critical { color: var(--red); background: var(--red-bg); }
.pill-High { color: #8a5a00; background: var(--amber-bg); }
.pill-Medium { color: var(--blue-700); background: var(--blue-100); }
.pill-Low { color: #4b586b; background: #eceff3; }
.tag { background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--blue-100); border-radius: 4px; }
.badge-overdue { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.due { font-size: .78rem; }
.card-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-3); border-top: 1px dashed var(--line); padding-top: var(--sp-2); }
.move-select { font-size: .78rem; padding: 3px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.icon-btn { border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 8px; color: var(--ink-soft); }
.icon-btn:hover { color: var(--red); border-color: var(--red); }
.confirm { display: flex; align-items: center; gap: var(--sp-2); font-size: .78rem; color: var(--red); font-weight: 600; }
.confirm .btn { padding: 2px 10px; font-size: .78rem; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover { background: #a31f1f; }

/* ===== Modal & form ===== */
.overlay { position: fixed; inset: 0; background: rgba(11,42,85,.55); display: flex; align-items: flex-start; justify-content: center; padding: var(--sp-5) var(--sp-3); overflow-y: auto; z-index: 50; }
.modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 560px; padding: var(--sp-5); }
.modal h2 { margin-top: 0; color: var(--blue-900); }
.field { margin-bottom: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-1); }
.field label { font-weight: 600; font-size: .85rem; }
.field input, .field select, .field textarea { padding: var(--sp-2); border: 1px solid #9aa6b8; border-radius: 4px; background: #fff; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); background: #fff8f8; }
.error { color: var(--red); font-size: .78rem; min-height: 0; margin: 0; }
.hint { color: var(--ink-soft); font-size: .72rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.form-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-4); }

/* ===== Toasts ===== */
.toasts { position: fixed; right: var(--sp-4); bottom: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); z-index: 100; max-width: calc(100vw - 32px); }
.toast { background: var(--blue-900); color: #fff; padding: var(--sp-3) var(--sp-4); border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.25); font-size: .9rem; border-left: 6px solid #4caf82; }
.toast.warn { border-left-color: #f5a623; }

/* ===== Responsive ===== */
@media (max-width: 767px) {
  .board { flex-direction: column; padding: 0 var(--sp-3) var(--sp-4); }
  .column { width: 100%; flex: none; }
  .app-header { padding: var(--sp-3); }
  .summary { margin-left: 0; }
  .filters, .demo-note { margin-left: var(--sp-3); margin-right: var(--sp-3); }
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== Header with live summary ===== -->
<header class="app-header">
  <span class="wordmark" aria-label="IT PMO">IT PMO</span>
  <h1 class="header-title">Project Board</h1>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn btn-primary" id="openAdd">+ Add Task</button>
</header>
<p class="demo-note">Demo / training tool. Board data is held in memory only: refreshing the page resets it to the seeded demo tasks.</p>

<!-- ===== Filter bar ===== -->
<section class="filters" aria-label="Filters">
  <label for="fProject">Project
    <select id="fProject"><option value="">All projects</option></select>
  </label>
  <label for="fAssignee">Assignee contains
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </label>
  <label for="fPriority">Priority
    <select id="fPriority"><option value="">All priorities</option></select>
  </label>
  <button type="button" class="btn" id="clearFilters">Clear filters</button>
</section>

<!-- ===== Kanban board (columns rendered by renderBoard) ===== -->
<main class="board" id="board" aria-label="Kanban board"></main>

<!-- ===== Add Task modal ===== -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add Task</h2>
    <form id="taskForm" novalidate>
      <div class="field" data-field="title">
        <label for="title">Task Title *</label>
        <input type="text" id="title" name="title" maxlength="80" autocomplete="off" aria-describedby="err-title">
        <p class="error" id="err-title"></p>
      </div>
      <div class="field" data-field="description">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" maxlength="500" aria-describedby="err-description"></textarea>
        <p class="error" id="err-description"></p>
      </div>
      <div class="grid-2">
        <div class="field" data-field="project">
          <label for="project">Project / Workstream *</label>
          <select id="project" name="project" aria-describedby="err-project"></select>
          <p class="error" id="err-project"></p>
        </div>
        <div class="field" data-field="category">
          <label for="category">Category *</label>
          <select id="category" name="category" aria-describedby="err-category"></select>
          <p class="error" id="err-category"></p>
        </div>
      </div>
      <div class="field" data-field="assignee">
        <label for="assignee">Assignee *</label>
        <input type="text" id="assignee" name="assignee" autocomplete="off" aria-describedby="err-assignee">
        <p class="error" id="err-assignee"></p>
      </div>
      <div class="grid-2">
        <div class="field" data-field="priority">
          <label for="priority">Priority</label>
          <select id="priority" name="priority" aria-describedby="err-priority"></select>
          <p class="error" id="err-priority"></p>
        </div>
        <div class="field" data-field="status">
          <label for="status">Status</label>
          <select id="status" name="status" aria-describedby="err-status"></select>
          <p class="error" id="err-status"></p>
        </div>
      </div>
      <div class="field" data-field="dueDate">
        <label for="dueDate">Due Date *</label>
        <input type="date" id="dueDate" name="dueDate" aria-describedby="err-dueDate">
        <p class="error" id="err-dueDate"></p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast region -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  FORMSUBMIT ACTIVATION NOTE
  FormSubmit needs a one-time activation: the FIRST submission to a new address
  triggers a confirmation email to that address. Submissions are only delivered
  after the activation link in that email has been clicked.
  To change the destination address, edit FORMSUBMIT_ENDPOINT below (one place only).
-->
<script>
"use strict";

/* =========================================================
   1. CONFIG  (swap the email address here, only here)
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* =========================================================
   2. CONSTANTS
   ========================================================= */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];

/* =========================================================
   3. STATE (single source of truth, memory only)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  pendingDeleteId: null,
  nextNum: 1
};

/* =========================================================
   4. HELPERS
   ========================================================= */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function toDateString(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function todayString() { return toDateString(new Date()); }
function offsetDate(days) { const d = new Date(); d.setDate(d.getDate() + days); return toDateString(d); }

function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayString(); }

function formatDate(s) {
  const p = s.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function nextId() {
  const id = "UOB-ITPM-" + String(state.nextNum).padStart(4, "0");
  state.nextNum += 1;
  return id;
}

/* =========================================================
   5. SEED DATA (demo only; dates are relative to today)
   ========================================================= */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift and shift the FX pricing microservices with parallel run.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor security patch to teller virtual desktops.", "Cybersecurity Uplift", "Cybersecurity", "Daniel Lim", "Critical", -2, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the onboarding flow changes.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"],
    ["Core ledger upgrade impact assessment", "Assess interfaces affected by the core ledger version upgrade.", "Core Banking Upgrade", "Application Development", "Marcus Tan", "Medium", 30, "Backlog"],
    ["Renew data warehouse support contract", "Negotiate renewal terms and obtain procurement approval.", "Vendor Management", "Vendor", "Elena Wong", "Medium", -5, "Blocked"],
    ["Build customer churn dashboard", "Self-service dashboard for retail analytics team.", "Data & Analytics", "Data", "Kenji Ito", "Low", 45, "Backlog"],
    ["Quarterly access recertification evidence", "Compile evidence pack for internal audit.", "Cybersecurity Uplift", "Compliance", "Sarah Goh", "High", -10, "Done"],
    ["Decommission legacy SFTP gateway", "Retire old file gateway after partner cut-over confirmed.", "Infrastructure & Cloud", "Infrastructure", "Rajesh Kumar", "Low", 14, "Done"]
  ];
  return seed.map(function (s) {
    return { id: nextId(), title: s[0], description: s[1], project: s[2], category: s[3], assignee: s[4], priority: s[5], dueDate: offsetDate(s[6]), status: s[7] };
  });
}

/* =========================================================
   6. FILTERING
   ========================================================= */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    if (f.project && t.project !== f.project) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (needle && t.assignee.toLowerCase().indexOf(needle) === -1) return false;
    return true;
  });
}

/* =========================================================
   7. RENDERING (all card DOM is produced here)
   ========================================================= */
function renderSummary() {
  const total = state.tasks.length;
  const overdue = state.tasks.filter(isOverdue).length;
  let html = '<li><strong>' + total + '</strong>Total</li>';
  STATUSES.forEach(function (s) {
    html += '<li><strong>' + state.tasks.filter(function (t) { return t.status === s; }).length + '</strong>' + escapeHtml(s) + '</li>';
  });
  html += '<li class="is-overdue"><strong>' + overdue + '</strong>Overdue</li>';
  document.getElementById("summary").innerHTML = html;
}

function renderCard(task) {
  const confirming = state.pendingDeleteId === task.id;
  const moveOptions = '<option value="">Move ▸</option>' + STATUSES.filter(function (s) { return s !== task.status; })
    .map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join("");
  const actions = confirming
    ? '<span class="confirm">Delete? <button type="button" class="btn btn-danger" data-action="delete-yes" data-id="' + escapeHtml(task.id) + '">Yes</button>' +
      '<button type="button" class="btn" data-action="delete-no" data-id="' + escapeHtml(task.id) + '">No</button></span>'
    : '<select class="move-select" data-action="move" data-id="' + escapeHtml(task.id) + '" aria-label="Move ' + escapeHtml(task.id) + ' to another column">' + moveOptions + '</select>' +
      '<button type="button" class="icon-btn" data-action="delete" data-id="' + escapeHtml(task.id) + '" aria-label="Delete task ' + escapeHtml(task.id) + '">×</button>';
  return '<article class="card prio-' + escapeHtml(task.priority) + '" draggable="true" data-id="' + escapeHtml(task.id) + '"' +
    (task.description ? ' title="' + escapeHtml(task.description) + '"' : '') + '>' +
    '<div class="card-top"><span class="card-id">' + escapeHtml(task.id) + '</span>' +
    '<span class="pill pill-' + escapeHtml(task.priority) + '">' + escapeHtml(task.priority) + '</span></div>' +
    '<h3 class="card-title">' + escapeHtml(task.title) + '</h3>' +
    '<p class="card-meta">' + escapeHtml(task.project) + '</p>' +
    '<p class="card-meta">👤 ' + escapeHtml(task.assignee) + '</p>' +
    '<div class="row"><span class="due">Due ' + escapeHtml(formatDate(task.dueDate)) + '</span>' +
    (isOverdue(task) ? '<span class="badge-overdue">Overdue</span>' : '') +
    '<span class="tag">' + escapeHtml(task.category) + '</span></div>' +
    '<div class="card-actions">' + actions + '</div></article>';
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(function (status) {
    const cards = visible.filter(function (t) { return t.status === status; });
    return '<section class="column" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-head"><h2>' + escapeHtml(status) + '</h2><span class="count" aria-label="' + cards.length + ' tasks">' + cards.length + '</span></div>' +
      '<div class="cards">' + (cards.length ? cards.map(renderCard).join("") : '<p class="empty">No tasks</p>') + '</div></section>';
  }).join("");
  renderSummary();
}

/* =========================================================
   8. ACTIONS (mutate state, then re-render)
   ========================================================= */
function moveTask(id, status) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(status) === -1 || task.status === status) return;
  task.status = status;
  renderBoard();
  showToast(id + " moved to " + status);
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.pendingDeleteId = null;
  renderBoard();
  showToast(id + " deleted");
}

function addTask(data) {
  const task = {
    id: nextId(), title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* =========================================================
   9. TOASTS
   ========================================================= */
function showToast(message, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type === "warn" ? " warn" : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function () { el.remove(); }, type === "warn" ? 6000 : 3500);
}

/* =========================================================
   10. FORMSUBMIT NOTIFICATION
   ========================================================= */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* =========================================================
   11. FORM: validation, modal, submit
   ========================================================= */
const form = document.getElementById("taskForm");
let lastFocus = null;

function fillSelect(el, options, selected) {
  el.innerHTML = options.map(function (o) {
    return '<option value="' + escapeHtml(o) + '"' + (o === selected ? " selected" : "") + '>' + escapeHtml(o) + '</option>';
  }).join("");
}

function readForm() {
  return {
    title: form.title.value.trim(), description: form.description.value.trim(),
    project: form.project.value, category: form.category.value,
    assignee: form.assignee.value.trim(), priority: form.priority.value,
    dueDate: form.dueDate.value, status: form.status.value
  };
}

function validate(d) {
  const e = {};
  if (!d.title) e.title = "Task title is required.";
  else if (d.title.length > 80) e.title = "Title must be 80 characters or fewer.";
  if (d.description.length > 500) e.description = "Description must be 500 characters or fewer.";
  if (PROJECTS.indexOf(d.project) === -1) e.project = "Choose a project.";
  if (CATEGORIES.indexOf(d.category) === -1) e.category = "Choose a category.";
  if (!d.assignee) e.assignee = "Assignee is required.";
  if (PRIORITIES.indexOf(d.priority) === -1) e.priority = "Choose a priority.";
  if (STATUSES.indexOf(d.status) === -1) e.status = "Choose a status.";
  if (!d.dueDate) e.dueDate = "Due date is required.";
  else if (d.dueDate < todayString()) e.dueDate = "Due date cannot be in the past.";
  return e;
}

function showErrors(errors) {
  ["title", "description", "project", "category", "assignee", "priority", "status", "dueDate"].forEach(function (f) {
    const wrap = form.querySelector('[data-field="' + f + '"]');
    const msg = document.getElementById("err-" + f);
    msg.textContent = errors[f] || "";
    wrap.classList.toggle("invalid", Boolean(errors[f]));
    form.elements[f].setAttribute("aria-invalid", errors[f] ? "true" : "false");
  });
}

function resetForm() {
  form.reset();
  fillSelect(form.project, PROJECTS);
  fillSelect(form.category, CATEGORIES);
  fillSelect(form.priority, PRIORITIES, "Medium");
  fillSelect(form.status, STATUSES, "Backlog");
  form.dueDate.min = todayString();
  showErrors({});
}

function openModal() {
  lastFocus = document.activeElement;
  resetForm();
  document.getElementById("overlay").hidden = false;
  form.title.focus();
}
function closeModal() {
  document.getElementById("overlay").hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

async function handleSubmit(ev) {
  ev.preventDefault();
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  const firstBad = Object.keys(errors)[0];
  if (firstBad) { form.elements[firstBad].focus(); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  const task = addTask(data);            // optimistic: card appears immediately
  closeModal();
  showToast("Task " + task.id + " added");

  try {
    await notifyNewTask(task);           // runs after the card is on the board
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

/* =========================================================
   12. EVENT WIRING (delegated; drag & drop; filters)
   ========================================================= */
function wireBoardEvents() {
  const board = document.getElementById("board");
  let dragId = null;

  board.addEventListener("click", function (ev) {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action, id = el.dataset.id;
    if (act === "delete") { state.pendingDeleteId = id; renderBoard(); }
    else if (act === "delete-no") { state.pendingDeleteId = null; renderBoard(); }
    else if (act === "delete-yes") { deleteTask(id); }
  });

  board.addEventListener("change", function (ev) {
    const el = ev.target.closest('[data-action="move"]');
    if (el && el.value) moveTask(el.dataset.id, el.value);
  });

  board.addEventListener("dragstart", function (ev) {
    const card = ev.target.closest(".card");
    if (!card) return;
    dragId = card.dataset.id;
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", function () {
    dragId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(function (n) { n.classList.remove("dragging", "drop-target"); });
  });
  board.addEventListener("dragover", function (ev) {
    const col = ev.target.closest(".column");
    if (!col || !dragId) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach(function (n) { if (n !== col) n.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", function (ev) {
    const col = ev.target.closest(".column");
    if (col && !col.contains(ev.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", function (ev) {
    const col = ev.target.closest(".column");
    if (!col || !dragId) return;
    ev.preventDefault();
    const id = dragId;
    dragId = null;
    moveTask(id, col.dataset.status);
  });
}

function wireFilters() {
  const p = document.getElementById("fProject"), a = document.getElementById("fAssignee"), r = document.getElementById("fPriority");
  p.addEventListener("change", function () { state.filters.project = p.value; renderBoard(); });
  a.addEventListener("input", function () { state.filters.assignee = a.value; renderBoard(); });
  r.addEventListener("change", function () { state.filters.priority = r.value; renderBoard(); });
  document.getElementById("clearFilters").addEventListener("click", function () {
    state.filters = { project: "", assignee: "", priority: "" };
    p.value = ""; a.value = ""; r.value = "";
    renderBoard();
  });
}

function wireModal() {
  document.getElementById("openAdd").addEventListener("click", openModal);
  document.getElementById("cancelAdd").addEventListener("click", closeModal);
  form.addEventListener("submit", handleSubmit);
  document.getElementById("overlay").addEventListener("mousedown", function (ev) {
    if (ev.target.id === "overlay") closeModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !document.getElementById("overlay").hidden) closeModal();
  });
}

/* =========================================================
   13. INIT
   ========================================================= */
function init() {
  const fp = document.getElementById("fProject"), fr = document.getElementById("fPriority");
  PROJECTS.forEach(function (x) { fp.insertAdjacentHTML("beforeend", '<option value="' + escapeHtml(x) + '">' + escapeHtml(x) + '</option>'); });
  PRIORITIES.forEach(function (x) { fr.insertAdjacentHTML("beforeend", '<option value="' + escapeHtml(x) + '">' + escapeHtml(x) + '</option>'); });
  state.tasks = seedTasks();
  resetForm();
  wireBoardEvents();
  wireFilters();
  wireModal();
  renderBoard();
}
init();
</script>
